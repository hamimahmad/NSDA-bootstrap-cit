<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIT Website</title>
  <link rel="icon" type="image/x-icon" href="./images/fav.png">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-light ">
    <div class="container">
      <a class="navbar-brand" href="#"><img src="../images/logocit.png" alt="logo"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse mx-5" id="navbarSupportedContent">
        <ul class="navbar-nav  me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active nav-a" target="_blank" aria-current="page" href="../index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" target="_blank" aria-current="page" href="../pages/aboutus.html">About
              US</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" target="_blank" aria-current="page" href="../pages/contact.html">Contact US</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" target="_blank" aria-current="page" href="../pages/faq.html">FAQ</a>
          </li>



        </ul>
        <form class="d-flex">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <section class="contact-section py-5">
    <div class="container">

      <div class="text-center mb-4">
        <h2 class="fw-bold">Contact Us</h2>
        <p class="text-muted">We’re here to help. Reach out anytime.</p>
      </div>

      <div class="row g-4 align-items-center">


        <div class="col-md-5">
          <h5 class="fw-bold mb-3">Get In Touch</h5>
          <p class="mb-2"><strong>Address:</strong> Dhanmondi, Dhaka, Bangladesh</p>
          <p class="mb-2"><strong>Phone:</strong> +880 1234 567 890</p>
          <p class="mb-2"><strong>Email:</strong> info@example.com</p>
          <p><strong>Working Hours:</strong> Sat–Thu, 10AM – 8PM</p>
        </div>


        <div class="col-md-7">
          <form>
            <div class="row g-3">

              <div class="col-md-6">
                <input type="text" class="form-control" placeholder="Your Name">
              </div>

              <div class="col-md-6">
                <input type="email" class="form-control" placeholder="Your Email">
              </div>

              <div class="col-12">
                <input type="text" class="form-control" placeholder="Subject">
              </div>

              <div class="col-12">
                <textarea class="form-control" rows="4" placeholder="Message"></textarea>
              </div>

              <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                Submit
              </button>

            </div>
          </form>
        </div>

      </div>

    </div>
  </section>


  <div class="container">
    <!-- Button trigger modal -->


    <!-- Modal -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
      aria-labelledby="staticBackdropLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="staticBackdropLabel">Modal title</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            ...
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary">Understood</button>
          </div>
        </div>
      </div>
    </div>
  </div>



  <script src="../js/bootstrap.min.js"></script>
  <script src="../js/script.js"></script>
</body>

</html>
